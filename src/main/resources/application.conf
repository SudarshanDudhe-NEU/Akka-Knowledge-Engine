akka {
  actor {
    provider = "cluster"
    
    serialization-bindings {
      "com.akka.cluster.app.CborSerializable" = jackson-cbor
    }
  }
  
  remote.artery {
    canonical {
      hostname = "127.0.0.1"
      port = 0  # Will be overridden by application
    }
  }
  
  cluster {
    seed-nodes = [
      "akka://ClusterSystem@127.0.0.1:2551"
    ]
    
    # Enable the split brain resolver
    downing-provider-class = "akka.cluster.sbr.SplitBrainResolverProvider"
    
    # Log cluster events for demonstration
    log-info = on
    log-info-verbose = on
    
    # Minimum number of members before cluster becomes available
    min-nr-of-members = 1
    
    split-brain-resolver {
      # Use keep-majority strategy
      active-strategy = keep-majority
      
      # Time margin after which shards or singletons that belonged to a downed/removed
      # partition are created in surviving partition.
      stable-after = 7s
    }
  }
  
  # Logging configuration
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  loglevel = "INFO"
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"
}
